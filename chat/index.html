<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Chat</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --border: #e2e1dc; --user: #e8eefc; --accent: #2f5bd3; --code-bg: #f1f0ec; --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #9a9a93;
      --border: #33332f; --user: #22304f; --accent: #7b9cff; --code-bg: #2a2a27; --danger: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, sans-serif;
         display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
           border-bottom: 1px solid var(--border); background: var(--panel); }
  header .model { font-weight: 600; }
  header .status { color: var(--muted); font-size: 13px; margin-left: auto; }
  header .status.warn { color: var(--danger); }
  button { font: inherit; border: 1px solid var(--border); background: var(--panel); color: var(--text);
           border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  #log { flex: 1; overflow-y: auto; padding: 16px; }
  .inner { max-width: 820px; margin: 0 auto; }
  .msg { margin: 0 0 16px; padding: 10px 14px; border-radius: 10px; background: var(--panel);
         border: 1px solid var(--border); overflow-wrap: anywhere; }
  .msg.user { background: var(--user); border-color: transparent; }
  .msg.error { color: var(--danger); }
  .text { white-space: pre-wrap; }
  .footnote { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .footnote:empty { display: none; }
  details { margin-bottom: 8px; color: var(--muted); font-size: 13px; }
  details .text { border-left: 3px solid var(--border); padding-left: 10px; margin-top: 6px; }
  .text code { background: var(--code-bg); border-radius: 4px; padding: 1px 5px;
               font: 13px ui-monospace, Menlo, Consolas, monospace; }
  pre { position: relative; background: var(--code-bg); border-radius: 8px; padding: 12px; overflow-x: auto;
        font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
  pre button { position: absolute; top: 6px; right: 6px; font-size: 12px; padding: 2px 8px; }
  footer { padding: 12px 16px 16px; border-top: 1px solid var(--border); background: var(--panel); }
  footer .inner { display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; resize: none; font: inherit; color: var(--text); background: var(--bg);
             border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; min-height: 44px; max-height: 40vh; }
  .empty { color: var(--muted); text-align: center; margin-top: 20vh; }
</style>
</head>
<body>
<header>
  <span class="model" id="model">…</span>
  <button id="new">Chat mới</button>
  <span class="status" id="status"></span>
</header>
<div id="log"><div class="inner" id="msgs"><p class="empty">Chỉ chat text — không upload file, không tool. Copy code qua lại với notebook bằng tay.</p></div></div>
<footer>
  <div class="inner">
    <textarea id="input" rows="1" placeholder="Nhập câu hỏi… (Enter để gửi, Shift+Enter xuống dòng)"></textarea>
    <button id="send" class="primary">Gửi</button>
  </div>
</footer>
<script>
const $ = (id) => document.getElementById(id);
let history = [];
let controller = null;
let lockAt = null;

function splitThinking(content, reasoning) {
  // R1 distill trả suy nghĩ trong <think>…</think>; một số provider bỏ mất thẻ mở, hoặc tách ra field reasoning riêng.
  let thinking = reasoning, answer = content;
  const open = content.indexOf("<think>"), close = content.indexOf("</think>");
  if (open !== -1) {
    const end = close === -1 ? content.length : close;
    thinking += content.slice(open + 7, end);
    answer = content.slice(0, open) + (close === -1 ? "" : content.slice(close + 8));
  } else if (close !== -1) {
    thinking += content.slice(0, close);
    answer = content.slice(close + 8);
  }
  return { thinking: thinking.trim(), answer: answer.trim() };
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
}

function renderText(container, text) {
  container.replaceChildren();
  text.split(/```/).forEach((part, i) => {
    if (i % 2 === 0) {
      if (part.trim()) {
        const div = document.createElement("div");
        div.className = "text";
        // Escape trước rồi mới thay **đậm** và `code`, nên không chèn được HTML từ output của model.
        div.innerHTML = escapeHtml(part.replace(/^\n+|\n+$/g, ""))
          .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
          .replace(/`([^`\n]+)`/g, "<code>$1</code>");
        container.appendChild(div);
      }
      return;
    }
    const code = part.replace(/^[\w+-]*\n/, "");
    const pre = document.createElement("pre");
    pre.textContent = code.replace(/\n$/, "");
    const btn = document.createElement("button");
    btn.textContent = "Copy";
    btn.onclick = () => navigator.clipboard.writeText(code).then(() => {
      btn.textContent = "Đã copy";
      setTimeout(() => (btn.textContent = "Copy"), 1200);
    });
    pre.appendChild(btn);
    container.appendChild(pre);
  });
}

function addMessage(role) {
  $("msgs").querySelector(".empty")?.remove();
  const div = document.createElement("div");
  div.className = "msg " + role;
  $("msgs").appendChild(div);
  return div;
}

function scrollDown() { $("log").scrollTop = $("log").scrollHeight; }

function setBusy(busy) {
  $("send").textContent = busy ? "Dừng" : "Gửi";
  $("send").classList.toggle("primary", !busy);
  $("new").disabled = busy;
}

async function send() {
  if (controller) { controller.abort(); return; }
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = "";
  autosize();

  history.push({ role: "user", content: text });
  renderText(addMessage("user"), text);

  const box = addMessage("assistant");
  const details = document.createElement("details");
  details.innerHTML = "<summary>Đang suy nghĩ…</summary>";
  const thinkingText = document.createElement("div");
  thinkingText.className = "text";
  details.appendChild(thinkingText);
  const answerBox = document.createElement("div");
  const footnote = document.createElement("div");
  footnote.className = "footnote";
  box.append(details, answerBox, footnote);
  scrollDown();

  controller = new AbortController();
  setBusy(true);
  let content = "", reasoning = "", answer = "";
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history }),
      signal: controller.signal,
    });
    if (!res.ok) throw new Error((await res.json()).error || res.statusText);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line) continue;
        const chunk = JSON.parse(line);
        if (chunk.provider !== undefined) {
          footnote.textContent = chunk.provider + (chunk.skipped.length ? `  (bỏ qua ${chunk.skipped.length} provider lỗi)` : "");
          footnote.title = chunk.skipped.join("\n");
          continue;
        }
        content += chunk.c;
        reasoning += chunk.r;
      }
      const parts = splitThinking(content, reasoning);
      answer = parts.answer;
      thinkingText.textContent = parts.thinking;
      details.style.display = parts.thinking ? "" : "none";
      renderText(answerBox, answer);
      scrollDown();
    }
    details.querySelector("summary").textContent = "Xem quá trình suy nghĩ";
    // Không gửi lại phần suy nghĩ vào lịch sử: đúng khuyến nghị dùng R1 và đỡ tốn token.
    history.push({ role: "assistant", content: answer });
  } catch (err) {
    history.pop();
    if (err.name === "AbortError") {
      details.querySelector("summary").textContent = "Đã dừng";
    } else {
      box.classList.add("error");
      box.textContent = err.message;
    }
  } finally {
    controller = null;
    setBusy(false);
    $("input").focus();
  }
}

function autosize() {
  const t = $("input");
  t.style.height = "auto";
  t.style.height = t.scrollHeight + 2 + "px"; // +2 cho viền, tránh hiện thanh cuộn thừa
}

async function loadStatus() {
  const s = await (await fetch("/api/status")).json();
  $("model").textContent = s.providers.length ? s.providers[0] : "(chưa cấu hình provider)";
  $("model").title = "Thứ tự fallback:\n" + s.providers.map((p, i) => `${i + 1}. ${p}`).join("\n");
  if (s.providers.length > 1) $("model").textContent += `  +${s.providers.length - 1} fallback`;
  if (s.problem) {
    $("status").textContent = s.problem;
    $("status").classList.add("warn");
  }
  if (s.seconds_left !== null) lockAt = Date.now() + s.seconds_left * 1000;
}

function tick() {
  if (lockAt === null || $("status").classList.contains("warn")) return;
  const left = Math.max(0, Math.round((lockAt - Date.now()) / 1000));
  const h = Math.floor(left / 3600), m = Math.floor((left % 3600) / 60), s = left % 60;
  $("status").textContent = left ? `LLM khoá sau ${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}` : "LLM đã bị khoá";
}

$("send").onclick = send;
$("input").addEventListener("input", autosize);
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$("new").onclick = () => {
  history = [];
  $("msgs").innerHTML = '<p class="empty">Chat mới.</p>';
  $("input").focus();
};
autosize();
loadStatus().then(tick);
setInterval(tick, 1000);
</script>
</body>
</html>
